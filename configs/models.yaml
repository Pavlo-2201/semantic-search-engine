# Конфигурации кодировщиков. Требования каждой модели (префиксы, пулинг,
# нормализация) заданы явно: код их не угадывает, а для sentence-transformers
# ещё и сверяет указанный пулинг с загруженной моделью.

models:
  lsa-300:
    backend: lsa
    dim: 300
    normalize: true
    notes: >
      TF-IDF и усечённое SVD, обучается на корпусе. Не требует загрузки весов,
      поэтому измеряется в любом окружении и служит нижней границей качества
      векторного поиска.

  word2vec-200:
    backend: word2vec
    dim: 200
    normalize: true
    word2vec:
      window: 5
      min_count: 3
      sg: 1
      negative: 10
      epochs: 10
      seed: 42
    notes: >
      Word2Vec (skip-gram), обучается на корпусе; вектор текста — среднее по
      словам с весом IDF. Устроен иначе, чем LSA: учится на локальных контекстах
      слов, а не на матрице «документ — термин».

  e5-small:
    backend: sentence-transformers
    model_name: intfloat/multilingual-e5-small
    revision: 614241f622f53c4eeff9890bdc4f31cfecc418b3
    # веса скачаны заранее, как у rubert-tiny2 (в Git не попадают); sha256
    # model.safetensors 1a55775f53449dac10a2bcbc312469fac40b96d53198c407081a831f81c98477
    local_path: models/e5-small
    # E5 обучена с префиксами; без них качество заметно падает
    query_prefix: "query: "
    document_prefix: "passage: "
    pooling: mean
    normalize: true
    max_seq_length: 512
    batch_size: 32
    notes: Многоязычная модель E5, 384 измерения, лицензия MIT.

  e5-base:
    backend: sentence-transformers
    model_name: intfloat/multilingual-e5-base
    query_prefix: "query: "
    document_prefix: "passage: "
    pooling: mean
    normalize: true
    max_seq_length: 512
    batch_size: 16
    notes: Многоязычная модель E5, 768 измерений, лицензия MIT.

  labse:
    backend: sentence-transformers
    model_name: sentence-transformers/LaBSE
    query_prefix: ""
    document_prefix: ""
    # у LaBSE в sentence-transformers пулинг по CLS-токену
    pooling: cls
    normalize: true
    max_seq_length: 256
    batch_size: 16
    notes: LaBSE, 768 измерений, лицензия Apache-2.0.

  rubert-tiny2:
    backend: sentence-transformers
    model_name: cointegrated/rubert-tiny2
    revision: e8ed3b0c8bbf4fb6984c3de043bf7d2f4e5969ae
    # каталог с заранее скачанными весами: в окружении сборки нет доступа к
    # huggingface.co, и веса принесены в репозиторий извне (в Git не попадают)
    local_path: models/rubert-tiny2
    query_prefix: ""
    document_prefix: ""
    # пулинг взят из 1_Pooling/config.json самой модели: у rubert-tiny2 это CLS,
    # а не среднее — проверка пулинга в коде ловит такую ошибку конфигурации
    pooling: cls
    normalize: true
    max_seq_length: 512
    batch_size: 64
    notes: Маленькая русская модель sentence-transformers, 312 измерений, лицензия MIT.
